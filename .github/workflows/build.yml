# Builds the Switch wrapper (.nro) in devkitPro's own container on every push, and attaches
# it to a GitHub release when a tag v* is pushed. Nothing from the game is involved: the
# wrapper contains no game code or assets.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build mono_hello
        run: |
          dotnet build managed/mono_hello -c Release -o out
          ls -la out/mono_hello.dll
      # The loader builds Il2CppInterop from the owner's ARM64 fork (LGPL-3.0; the
      # fork is the source of the "1.5.0-arm64c" build the phone runs).
      - name: Fetch Il2CppInterop (ARM64 fork)
        run: |
          git clone --depth 1 https://github.com/silentanarchist/Il2CppInteropARM64 extern/Il2CppInteropARM64
          cd extern/Il2CppInteropARM64 && git log -1 --oneline
      - name: Build nxloader
        run: |
          dotnet build managed/nxloader -c Release -o loader
          rm -f loader/*.pdb loader/*.xml loader/*.json
          ls -la loader
          mkdir -p pkg/MelonLoader/Loader pkg/MelonLoader/Il2CppAssemblies pkg/MelonLoader/Mods pkg/MelonLoader/UserData
          cp loader/*.dll pkg/MelonLoader/Loader/
          echo "Copy your refs\\il2cpp\\*.dll here (the generated Il2Cpp assemblies)." > pkg/MelonLoader/Il2CppAssemblies/README.txt
          cd pkg && zip -qr ../loader_sd.zip MelonLoader && cd .. && ls -la loader_sd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mono_hello
          path: |
            out/mono_hello.dll
            loader_sd.zip

  nro:
    runs-on: ubuntu-latest
    needs: managed
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # The image ships the whole switch-portlibs group (mesa, libdrm_nouveau, SDL2, zlib,
      # libpng, ffmpeg). devkitPro bans CI runners from its package server, so nothing is
      # installed here; whatever the Makefile needs must already be in the image.
      # The Mono runtime (mod milestone 1) is linked into the one and only .nro; it
      # starts only when /mono is on the card, otherwise the game boots without it.
      # The prebuilt mono-nx SDK (exelix11/mono-nx, release rel-3) is fetched here;
      # devkitPro's package server is not involved.
      - name: Fetch the mono-nx SDK
        run: |
          apt-get update -qq && apt-get install -y -qq unzip zip curl >/dev/null
          mkdir -p mono/sdk && cd mono/sdk
          curl -sSL -o sdk.zip https://github.com/exelix11/mono-nx/releases/download/rel-3/mono-nx-sdk-linux-x64.zip
          unzip -q sdk.zip && rm sdk.zip
          ls

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -j"$(nproc)" WF_MONO=1
          ls -la *.nro *.elf

      - uses: actions/download-artifact@v4
        with:
          name: mono_hello
          path: .
      - run: mv out/mono_hello.dll . && ls -la mono_hello.dll loader_sd.zip

      # The Mono runtime files for the SD card root (/mono): mono-nx's sd_files.zip
      # minus its demos, with logging on. BCL = dotnet/runtime (MIT), ICU data.
      - name: Package the /mono SD folder
        run: |
          mkdir -p sdpkg && cd sdpkg
          curl -sSL -o sd.zip https://github.com/exelix11/mono-nx/releases/download/rel-3/sd_files.zip
          unzip -q sd.zip "mono/*" && rm sd.zip
          rm -f mono/mono_nx.nro mono/pad_input.dll
          sed -i 's/^;logging = true/logging = true/; s/^default_assembly.*$/default_assembly  = \/mono\/none.dll/' mono/config.ini
          zip -qr ../mono_sd.zip mono
          cd .. && ls -la mono_sd.zip

      - uses: actions/upload-artifact@v4
        with:
          name: warpforge_nx
          path: |
            *.nro
            *.elf
            mono_hello.dll
            mono_sd.zip
            loader_sd.zip


      # Every push to main refreshes a rolling pre-release called "test", so a
      # build can be tried on hardware without a version number. A pushed v* tag
      # makes a proper release next to it.
      - name: Test pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: "Test build (latest main)"
          prerelease: true
          body: "Rolling build of the latest commit on main (${{ github.sha }}). The Mono runtime is linked in and starts only when mono_sd.zip is unpacked to the SD root. loader_sd.zip unpacks into the game folder (MelonLoader/...); without it, mono_hello.dll in the game folder runs the milestone probes instead."
          files: |
            *.nro
            *.elf
            mono_hello.dll
            mono_sd.zip
            loader_sd.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.nro
            *.elf
            mono_hello.dll
            mono_sd.zip
            loader_sd.zip
          generate_release_notes: true
