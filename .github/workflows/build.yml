# Builds the Switch wrapper (.nro) in devkitPro's own container on every push, and attaches
# it to a GitHub release when a tag v* is pushed. Nothing from the game is involved: the
# wrapper contains no game code or assets.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # The image ships the whole switch-portlibs group (mesa, libdrm_nouveau, SDL2, zlib,
      # libpng, ffmpeg). devkitPro bans CI runners from its package server, so nothing is
      # installed here; whatever the Makefile needs must already be in the image.
      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          make -j"$(nproc)"
          ls -la *.nro

      - uses: actions/upload-artifact@v4
        with:
          name: warpforge_nx
          path: "*.nro"

      # Every push to main refreshes a rolling pre-release called "test" (one .nro,
      # replaced each time), so a build can be tried on hardware without a version
      # number. A pushed v* tag makes a proper release next to it.
      - name: Test pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: "Test build (latest main)"
          prerelease: true
          body: "Rolling build of the latest commit on main (${{ github.sha }}). Untested unless the commit message says otherwise."
          files: "*.nro"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.nro"
          generate_release_notes: true
